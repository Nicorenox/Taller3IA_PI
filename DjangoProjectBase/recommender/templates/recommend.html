{% extends 'base.html' %}
{% block content %}

<div class="container py-4">
    <h2>Recommend me a movie</h2>
    <form action="{% url 'recommend' %}" method="GET">
        <div class="mb-3">
            <label for="prompt" class="form-label">Describe the movie you're looking for:</label>
            <input type="text" class="form-control" name="prompt" value="{{ prompt|default:'' }}" placeholder="Ej: Película de la segunda guerra mundial" />
        </div>
        <button type="submit" class="btn btn-primary">Recommend</button>
    </form>

    {% if prompt %}
        <p class="mt-3">Searching for: <strong>{{ prompt }}</strong></p>
    {% endif %}

    {% if movie %}
    <div class="card mt-4" style="max-width: 20rem;">
        <img src="{{ movie.image.url }}" class="card-img-top" alt="{{ movie.title }}">
        <div class="card-body">
            <h5 class="card-title">{{ movie.title }}</h5>
            <p class="card-text">{{ movie.description }}</p>
            <p class="card-text"><small class="text-muted">Similarity: {{ similarity|floatformat:4 }}</small></p>
        </div>
    </div>
    {% endif %}
</div>

{% endblock content %}
